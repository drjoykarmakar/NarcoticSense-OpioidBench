[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opioidbench"
version = "0.4.0"
description = "Research infrastructure for leakage-aware, uncertainty-aware benchmarking of opioid detection from analytical spectra."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
authors = [{name = "NarcoticSense-OpioidBench contributors"}]
dependencies = ["PyYAML>=6.0"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
chem = ["rdkit>=2024.3"]
excel = ["openpyxl>=3.1"]
spectral = ["numpy>=1.26"]
models = ["numpy>=1.26", "scikit-learn>=1.5"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pre-commit>=3.7", "openpyxl>=3.1", "numpy>=1.26", "scikit-learn>=1.5"]

[project.scripts]
opioidbench = "opioidbench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opioidbench = ["resources/*.yaml", "resources/*.csv"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
